name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Go vet & tests
        run: go vet ./... && go test ./...
      - name: Twenty couples (report)
        if: always()
        run: PERSONAS_OUT=$PWD/personas.md go test ./internal/app -run TestPersonas -count=1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: personas, path: personas.md, if-no-files-found: ignore }
      - name: Web build
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build
      - name: Playwright browser
        working-directory: e2e
        run: npm i --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: E2E (bot emulator + two phones)
        run: ./e2e/run.sh
      - name: Publish screenshots and logs to branch e2e-artifacts
        if: always() && github.event_name != 'pull_request'
        run: |
          set -e
          D=$(mktemp -d)
          mkdir -p "$D/shots" "$D/logs"
          cp e2e/shots/*.png "$D/shots/" 2>/dev/null || true
          cp e2e/.run/*.log "$D/logs/" 2>/dev/null || true
          echo "${GITHUB_SHA} ${{ job.status }}" > "$D/RUN"
          cd "$D" && git init -q -b e2e-artifacts && git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "e2e ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" e2e-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-shots
          path: |
            e2e/shots
            e2e/.run/*.log
          retention-days: 14
          include-hidden-files: true

  release:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build
        run: |
          set -e
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::7}" -o dist/vdvoem ./cmd/vdvoem
          (cd web && npm ci --no-audit --no-fund && npm run build)
          mkdir -p dist/web && cp -r web/dist/. dist/web/
          cp deploy/*.sh dist/ 2>/dev/null || true
          echo "${GITHUB_SHA}" > dist/VERSION
          tar -C dist -czf vdvoem-linux-amd64.tar.gz .
          sha256sum vdvoem-linux-amd64.tar.gz > vdvoem-linux-amd64.tar.gz.sha256
      - name: Publish rolling release «latest»
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest vdvoem-linux-amd64.tar.gz vdvoem-linux-amd64.tar.gz.sha256 \
            --title "latest (${GITHUB_SHA::7})" --notes "Built from ${GITHUB_SHA}" --target "${GITHUB_SHA}" --prerelease
