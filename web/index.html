<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#f4f4f4" />
    <link rel="icon" type="image/svg+xml" href="/app/favicon.svg" />
    <link rel="apple-touch-icon" href="/app/apple-touch-icon.png" />
    <link rel="manifest" href="/app/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Вдвоём" />
    <meta name="format-detection" content="telephone=no" />
    <title>Вдвоём</title>
    <script>
      // boot diagnostics: stages and script errors go to the server log (a hang on a phone becomes visible)
      var __t0 = Date.now(), __vdb = Math.random().toString(36).slice(2, 10)
      window.__vdlog = function (stage, msg) { try { navigator.sendBeacon('/api/client-log', JSON.stringify({ b: __vdb, stage: stage, msg: String(msg || '').slice(0, 300), ms: Date.now() - __t0 })) } catch (e) {} }
      addEventListener('error', function (e) { var t = e.target; __vdlog('error', (e.message || '') + ' ' + (t && (t.src || t.href) ? 'load ' + (t.src || t.href) : (e.filename || '') + ':' + (e.lineno || ''))) }, true)
      addEventListener('unhandledrejection', function (e) { __vdlog('reject', e.reason && (e.reason.message || e.reason)) })
      __vdlog('html', navigator.userAgent.slice(-60))
      // where a white screen goes: the network before any of our code ran (a VPN, a slow route) — measured
      // from the tap, not from this script; sent once the page has loaded
      addEventListener('load', function () {
        setTimeout(function () {
          try {
            var n = performance.getEntriesByType('navigation')[0], r = Math.round
            var js = performance.getEntriesByType('resource').filter(function (x) { return /assets\/index-/.test(x.name) && /\.js/.test(x.name) })[0]
            __vdlog('net', JSON.stringify({ dns: r(n.domainLookupEnd - n.domainLookupStart), tcp: r(n.connectEnd - n.connectStart), tls: n.secureConnectionStart ? r(n.connectEnd - n.secureConnectionStart) : 0, ttfb: r(n.responseStart - n.requestStart), html: r(n.responseEnd), run: r(performance.now()), js: js ? r(js.responseEnd - js.startTime) : -1, jskb: js ? r(js.transferSize / 1024) : -1, proto: n.nextHopProtocol || '' }))
          } catch (e) {}
        }, 0)
      })
    </script>
    <!-- Telegram's SDK from our own server (fast), telegram.org only if our copy is missing; then tell Telegram
         at once that the page is ready, so its grey screen gives way to our loader while the app downloads -->
    <script src="/app/telegram-web-app.js"></script>
    <script>
      if (!window.Telegram) document.write('<script src="https://telegram.org/js/telegram-web-app.js?56"><\/script>')
    </script>
    <script>
      try {
        var T = window.Telegram && Telegram.WebApp
        if (T && T.initData) { T.ready(); T.expand(); var dark = T.colorScheme === 'dark'; T.setHeaderColor && T.setHeaderColor(dark ? '#0f0f11' : '#f4f4f4'); T.setBackgroundColor && T.setBackgroundColor(dark ? '#0f0f11' : '#f4f4f4'); if (dark) document.documentElement.setAttribute('data-boot-dark', '') }
        __vdlog('tg', 'sdk=' + !!window.Telegram)
      } catch (e) {}
    </script>
    <script>
      // self-heal: if the app has not started in 9 s (a stale cached page asking for old files, a flaky network),
      // reload once or twice with a fresh URL; main.tsx cancels this as soon as it runs
      window.__vdBoot = setTimeout(function () {
        try {
          var n = +(sessionStorage.getItem('vd-reload') || 0)
          __vdlog('watchdog', 'reload ' + n + ' tg=' + !!(window.Telegram && window.Telegram.WebApp))
          if (n < 2) { sessionStorage.setItem('vd-reload', String(n + 1)); var u = new URL(location.href); u.searchParams.set('r', String(Date.now())); location.replace(u.toString()) }
        } catch (e) { location.reload() }
      }, 9000)
    </script>
  </head>
  <body>
    <div id="root">
      <!-- shown until the app starts: the two halves of the bridge draw themselves and meet -->
      <style>
        .boot{position:fixed;inset:0;display:grid;place-items:center;background:#f4f4f4}
        .boot svg{width:96px;height:64px;overflow:visible}
        .boot path{fill:none;stroke-width:9;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:bootdraw 1.1s cubic-bezier(.22,1,.36,1) .15s forwards,bootglow 1.6s ease-in-out 1.3s infinite}
        .boot .r{animation-delay:.3s,1.45s}
        @keyframes bootdraw{to{stroke-dashoffset:0}}
        @keyframes bootglow{50%{opacity:.55}}
        @media (prefers-color-scheme:dark){.boot{background:#0f0f11}.boot .r{stroke:#6b95ff}}
        [data-boot-dark] .boot{background:#0f0f11}[data-boot-dark] .boot .r{stroke:#6b95ff}
        @media (prefers-reduced-motion:reduce){.boot path{animation:none;stroke-dashoffset:0}}
      </style>
      <div class="boot" role="img" aria-label="Вдвоём загружается"><svg viewBox="0 0 84 56"><path class="l" pathLength="1" stroke="#ef6537" d="M8 46 Q 22 10 42 10"/><path class="r" pathLength="1" stroke="#3d6ef5" d="M76 46 Q 62 10 42 10"/></svg></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
